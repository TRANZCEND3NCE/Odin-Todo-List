<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Odin Todo List</title><script defer src=main.js></script></head><body><div id=app><aside class=sidebar><h1>Todo List</h1><div class=projects-section><h2>Projects</h2><form id=project-form><input id=project-name placeholder="Project name" required> <button type=submit>Add Project</button></form><p id=project-error><div id=project-list></div></div></aside><main class=main-content><h2 id=project-title></h2><form id=todo-form><div class=form-group><label for=todo-title>Title</label> <input id=todo-title required></div><div class=form-group><label for=todo-description>Description</label> <textarea id=todo-description required></textarea></div><div class=form-group><label for=todo-due-date>Due date</label> <input type=date id=todo-due-date required></div><div class=form-group><label for=todo-priority>Priority</label> <select id=todo-priority><option value=low>Low<option value=medium selected>Medium<option value=high>High</select></div><button type=submit>Add Todo</button></form><div id=todo-list></div></main></div></body></html>
